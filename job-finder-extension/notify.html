<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Job Finder</title>
  <style>
    :root { --coconala: #e08600; --lancers: #0d72c8; --crowdworks: #18965a; --workana: #6b55d1; --accent: #3cb043; --dark: #161b22; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font: 13px/1.45 "Yu Gothic UI", "Meiryo", "Hiragino Sans", "Segoe UI", sans-serif; background: #fff; color: #1f2328; cursor: pointer; overflow: hidden;
      animation: appear .22s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes appear { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    body.leaving { transition: opacity .3s; opacity: 0; }
    header { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 14px; background: var(--dark); color: #fff; font-weight: 800; font-size: 14px; }
    header .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgb(60 176 67 / .25); }
    header .count { margin-left: auto; background: var(--accent); border-radius: 11px; padding: 1px 9px; font-size: 11px; letter-spacing: .03em; }
    header .close { border: 0; background: none; color: #9aa4ae; font-size: 18px; line-height: 1; padding: 2px 4px; cursor: pointer; }
    header .close:hover { color: #fff; }
    #groups { padding: 8px 10px 10px; display: grid; gap: 8px; }
    .group { position: relative; display: flex; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 8px;
      background: color-mix(in srgb, var(--site) 8%, #fff); }
    .group::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 3px; background: var(--site); }
    .group img { width: 26px; height: 26px; border-radius: 50%; flex: none; object-fit: contain; background: #fff; }
    .group .body { min-width: 0; flex: 1; }
    .group .head { font-weight: 800; color: var(--site); }
    ul { margin: 2px 0 0; padding: 0; list-style: none; }
    li { display: flex; gap: 6px; white-space: nowrap; }
    li span { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    li span::before { content: "• "; }
    li small { color: var(--site); font-weight: 700; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
    .more { color: #656d76; font-size: 11px; font-weight: 700; }
    .bar { position: fixed; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--accent); transform-origin: left; animation: shrink 5s linear forwards; }
    body:hover .bar { animation-play-state: paused; }
    @keyframes shrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    /* Green (the Accounts alerts): green background, dark-green header, each platform on a white card. */
    body.green { background: #1f883d; }
    body.green header { background: #145c29; }
    body.green header .dot { background: #fff; box-shadow: 0 0 0 3px rgb(255 255 255 / .3); }
    body.green header .count { background: #fff; color: #145c29; }
    body.green header .close { color: #cdebd5; }
    body.green .group { background: color-mix(in srgb, var(--site) 8%, #fff); box-shadow: 0 1px 2px rgb(0 0 0 / .15); }
    /* Sticky: no time limit, so no bar. */
    body.sticky .bar { display: none; }
  </style>
</head>
<body>
  <header><span class="dot"></span><span id="heading">Job Finder</span><span class="count" id="count"></span><button class="close" id="close" type="button" aria-label="Close">×</button></header>
  <div id="groups"></div>
  <div class="bar" id="bar"></div>
  <script src="notify.js"></script>
</body>
</html>
